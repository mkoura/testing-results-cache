name: Code checks

# No branch filter, unlike the same workflow in cardano-node-tests. This repo
# reviews in stacks, where a pull request's base is usually another feature
# branch, and filtering on `master` would skip every one of them. `tests.yaml`
# is unfiltered for the same reason.
on:
  pull_request:

env:
  PY_COLORS: "1"

permissions:
  contents: read

jobs:
  code_checks:
    runs-on: ubuntu-latest
    steps:
    - name: Check out repository
      uses: actions/checkout@v4
      with:
        persist-credentials: false
    - name: Set up python
      id: setup-python
      uses: actions/setup-python@v5
      with:
        # Pinned, not left to uv. ruff takes its target version from
        # `requires-python`, and mypy's results depend on the interpreter, so an
        # unpinned runner can disagree with the next one for no visible reason.
        python-version: '3.13'
    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true
    - name: Install project
      run: uv sync
    - name: Load cached pre-commit env
      id: cached-pre-commit
      uses: actions/cache@v4
      with:
        path: ~/.cache/pre-commit
        key: pre-commit-${{ runner.os }}-${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('.pre-commit-config.yaml') }}
    - name: Install pre-commit hooks
      # The hooks build their own environments. When that build fails the error
      # is only in the log, so print it rather than leaving a bare exit code.
      run: |
        mkdir -p ~/.cache/pre-commit
        true > ~/.cache/pre-commit/pre-commit.log
        uv run pre-commit install-hooks --color=always
        retval="$?"
        if [ "$retval" -ne 0 ]; then
          cat ~/.cache/pre-commit/pre-commit.log
        fi
        exit "$retval"
    - name: Run pre-commit linters
      run: uv run pre-commit run -a --show-diff-on-failure --color=always

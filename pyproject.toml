[project]
name = "testing-results-cache"
description = "Tests re-run cache for cardano-node-tests"
readme = "README.md"
maintainers = [
    { name = "IOG Cardano Node Test Engineering", email = "martin.kourim@iohk.io" },
]
requires-python = ">=3.12"
classifiers = [
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Programming Language :: Python :: 3",
    "Intended Audience :: Developers",
]
dynamic = ["version"]
# Upper bounds pin the major each dependency is tested against. `make
# update-uv-lock` resolves fresh, so without them a new major lands in the
# lockfile with no test run behind it.
dependencies = [
    "lxml>=5,<7",
    "flask>=3,<4",
    "flask-httpauth>=4,<5",
]

[project.urls]
Homepage = "https://github.com/mkoura/testing-results-cache"

[dependency-groups]
dev = [
    "gunicorn",
    "mypy",
    "pre-commit",
    "pytest",
    "ruff",
    "types-flask",
    "lxml-stubs",
]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["testing_results_cache"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["ANN", "ARG", "B", "C4", "C90", "D", "DTZ", "E", "EM", "F", "FURB", "I001", "ISC", "N", "PERF", "PIE", "PL", "PLE", "PLR", "PLW", "PT", "PTH", "Q", "RET", "RSE", "RUF", "SIM", "TRY", "UP", "W", "YTT"]
ignore = ["D10", "D203", "D212", "D213", "D214", "D215", "D404", "D405", "D406", "D407", "D408", "D409", "D410", "D411", "D413", "ISC001", "PLR0912", "PLR0913", "PLR0915", "PT001", "PT007", "PT012", "PT018", "PT023", "PTH123", "RET504", "TRY002", "TRY301", "UP006", "UP007", "UP035"]

[tool.ruff.lint.isort]
force-single-line = true

[tool.mypy]
show_error_context = true
verbosity = 0
ignore_missing_imports = true
follow_imports = "normal"
no_implicit_optional = true
allow_untyped_globals = false
allow_untyped_defs = false
warn_unused_configs = true
warn_return_any = true
